name: OrthoAnalysis CI

# Corre en cada push y en cada Pull Request contra main.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  motor-petrovic:
    name: Tests del motor (Petrovic 1996)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # main.py importa fastapi/uvicorn al cargarse, así que el test los necesita.
          # 1) Si hay requirements.txt en la raíz, se instala.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # 2) Respaldo garantizado: instala lo mínimo para importar main.py,
          #    por si requirements.txt no está en la raíz o tiene otro nombre.
          pip install fastapi "uvicorn[standard]" python-multipart

      - name: Ejecutar suite de regresión del motor
        run: pytest test_motor_petrovic.py -q

  frontend-check:
    name: Verificar sintaxis JS del frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: node --check del script de index.html
        run: |
          # Extrae el bloque <script> más grande de index.html y valida su sintaxis.
          python3 - <<'PY'
          import re, subprocess, sys, tempfile, os
          src = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", src, flags=re.S)
          if not scripts:
              print("No se encontró <script> en index.html"); sys.exit(1)
          big = max(scripts, key=len)
          with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as f:
              f.write(big); path = f.name
          r = subprocess.run(["node", "--check", path])
          os.unlink(path)
          sys.exit(r.returncode)
          PY
