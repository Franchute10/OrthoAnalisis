<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Consultor Clínico · OrthoAnalysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
/* ═══ Tokens: idénticos a los del módulo de cefalometría ═══ */
:root{
  --bg:          #F0F4F9;
  --surface:     #ffffff;
  --surface-low: #f7f9fc;
  --border:      #e2e8f0;
  --border-mid:  #c8d5e8;
  --navy:        #123462;
  --navy-hover:  #1a4a8c;
  --navy-light:  #eaf0fb;
  --orange:      #F58220;
  --orange-hover:#e07010;
  --orange-glow: rgba(245,130,32,.35);
  --ai:          #7c3aed;
  --ai-light:    rgba(124,58,237,.08);
  --green:       #16a34a;
  --red:         #dc2626;
  --text:        #1e2d40;
  --text-mid:    #4a6080;
  --text-dim:    #8a9ab0;
  --sans:        'Inter', system-ui, sans-serif;
  --head:        'Manrope', 'Inter', sans-serif;
  --mono:        'JetBrains Mono', monospace;
  --r-sm:        6px;
  --r-md:        10px;
  --r-lg:        14px;
  --shadow-sm:   0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:   0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--sans); background:var(--bg); color:var(--text);
  height:100vh; overflow:hidden; display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ═══ Cabecera (misma que el módulo de cefalometría) ═══ */
header{
  height:52px; background:var(--navy); display:flex; align-items:center;
  padding:0 18px; gap:14px; flex-shrink:0; box-shadow:var(--shadow-md); z-index:30;
}
.hdr-logo{height:26px; width:auto; display:block; border-radius:3px}
.hdr-sep{width:1px; height:22px; background:rgba(255,255,255,.22)}
.hdr-title{font-family:var(--head); font-size:15px; font-weight:700; color:#fff; letter-spacing:.2px}
.hdr-badge{
  font-size:10.5px; font-weight:600; color:#fff; background:rgba(255,255,255,.14);
  padding:3px 9px; border-radius:20px; letter-spacing:.3px;
}
.hdr-right{margin-left:auto; display:flex; align-items:center; gap:10px}
.hdr-doc{display:flex; flex-direction:column; align-items:flex-end; line-height:1.25}
.hdr-doc-name{font-size:12px; font-weight:600; color:#fff}
.hdr-doc-clinic{font-size:10px; color:rgba(255,255,255,.6)}
.hdr-avatar{
  width:30px; height:30px; border-radius:50%; background:var(--orange); color:#fff;
  display:grid; place-items:center; font-size:11px; font-weight:700; cursor:pointer;
  font-family:var(--head);
}

/* ═══ Layout ═══ */
.shell{flex:1; display:flex; min-height:0}

/* ═══ Barra lateral ═══ */
aside{
  width:260px; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; flex-shrink:0;
}
.side-top{padding:12px}
.btn-nuevo{
  width:100%; display:flex; align-items:center; justify-content:center; gap:7px;
  padding:10px 14px; border:none; border-radius:var(--r-sm); cursor:pointer;
  background:var(--orange); color:#fff; font-family:var(--sans);
  font-size:12.5px; font-weight:600; letter-spacing:.2px; transition:all .15s;
  box-shadow:0 2px 8px var(--orange-glow);
}
.btn-nuevo:hover{background:var(--orange-hover); transform:translateY(-1px)}
.side-label{
  font-size:10px; font-weight:700; color:var(--text-dim); text-transform:uppercase;
  letter-spacing:.8px; padding:14px 16px 6px;
}
.historial{flex:1; overflow-y:auto; padding:0 8px; min-height:0}
.historial::-webkit-scrollbar{width:6px}
.historial::-webkit-scrollbar-thumb{background:var(--border-mid); border-radius:3px}
.chat-item{
  display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--r-sm);
  cursor:pointer; transition:background .13s; margin-bottom:2px; position:relative;
}
.chat-item:hover{background:var(--surface-low)}
.chat-item.active{background:var(--navy-light)}
.chat-item.active .chat-titulo{color:var(--navy); font-weight:600}
.chat-ico{flex-shrink:0; color:var(--text-dim); width:14px; height:14px}
.chat-item.active .chat-ico{color:var(--navy)}
.chat-titulo{
  flex:1; font-size:12.5px; color:var(--text-mid); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; line-height:1.3;
}
.chat-del{
  opacity:0; background:none; border:none; cursor:pointer; color:var(--text-dim);
  font-size:15px; line-height:1; padding:2px 4px; border-radius:4px; flex-shrink:0;
}
.chat-item:hover .chat-del{opacity:1}
.chat-del:hover{color:var(--red); background:rgba(220,38,38,.09)}
.historial-vacio{font-size:11.5px; color:var(--text-dim); padding:8px 12px; line-height:1.5}

.side-nav{border-top:1px solid var(--border); padding:10px 8px}
.nav-item{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:var(--r-sm);
  font-size:12.5px; font-weight:500; color:var(--text-mid); text-decoration:none;
  transition:all .13s; margin-bottom:1px;
}
.nav-item:hover{background:var(--surface-low); color:var(--text)}
.nav-item.active{background:var(--navy-light); color:var(--navy); font-weight:600}
.nav-item.pendiente{opacity:.42; pointer-events:none}
.nav-ico{width:15px; height:15px; flex-shrink:0}
.badge-pronto{
  margin-left:auto; font-size:8.5px; font-weight:700; letter-spacing:.5px;
  text-transform:uppercase; background:var(--border); color:var(--text-dim);
  padding:2px 5px; border-radius:3px;
}

/* ═══ Zona principal ═══ */
main{flex:1; display:flex; flex-direction:column; min-width:0; background:var(--bg)}
.main-top{
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:12px 22px 0; flex-shrink:0;
}
.main-title{display:flex; align-items:center; gap:10px; margin-bottom:11px}
.main-title h1{font-family:var(--head); font-size:16px; font-weight:700; letter-spacing:.1px}
.chip-ai{
  font-size:10px; font-weight:600; color:var(--ai); background:var(--ai-light);
  padding:3px 8px; border-radius:20px; letter-spacing:.2px;
}
.stats{margin-left:auto; font-size:11px; color:var(--text-dim); font-family:var(--mono)}

.temas{display:flex; gap:6px; overflow-x:auto; padding-bottom:11px; scrollbar-width:none}
.temas::-webkit-scrollbar{display:none}
.tema-btn{
  flex-shrink:0; white-space:nowrap; padding:5px 12px; border-radius:20px;
  border:1px solid var(--border-mid); background:var(--surface); color:var(--text-mid);
  font-family:var(--sans); font-size:11.5px; font-weight:500; cursor:pointer; transition:all .13s;
}
.tema-btn:hover{border-color:var(--navy); color:var(--navy)}
.tema-btn.active{background:var(--navy); border-color:var(--navy); color:#fff; font-weight:600}

/* ═══ Chat ═══ */
.chat{flex:1; overflow-y:auto; padding:22px; min-height:0}
.chat::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-thumb{background:var(--border-mid); border-radius:4px}
.chat-inner{max-width:790px; margin:0 auto}

.bienvenida{text-align:center; padding:40px 20px}
.bienv-ico{
  width:52px; height:52px; margin:0 auto 16px; border-radius:var(--r-lg);
  background:var(--ai-light); color:var(--ai); display:grid; place-items:center; font-size:24px;
}
.bienvenida h2{font-family:var(--head); font-size:19px; margin-bottom:7px}
.bienvenida p{font-size:13px; color:var(--text-mid); max-width:430px; margin:0 auto 22px; line-height:1.6}
.sugerencias{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:9px; max-width:560px; margin:0 auto}
.sug{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:11px 14px; font-size:12.5px; color:var(--text-mid); cursor:pointer;
  text-align:left; transition:all .14s; font-family:var(--sans); line-height:1.4;
}
.sug:hover{border-color:var(--navy); color:var(--navy); box-shadow:var(--shadow-sm); transform:translateY(-1px)}

.msg{display:flex; gap:11px; margin-bottom:20px}
.msg-av{
  width:31px; height:31px; border-radius:var(--r-sm); flex-shrink:0; display:grid;
  place-items:center; font-size:11px; font-weight:700; font-family:var(--head);
}
.msg.user .msg-av{background:var(--navy); color:#fff}
.msg.ai   .msg-av{background:var(--ai-light); color:var(--ai); font-size:15px}
.burbuja{
  flex:1; min-width:0; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); padding:13px 15px; font-size:13.5px; line-height:1.68;
  box-shadow:var(--shadow-sm); position:relative;
}
.msg.user .burbuja{background:var(--navy-light); border-color:#d4e0f5}
.burbuja p{margin-bottom:9px} .burbuja p:last-child{margin-bottom:0}
.burbuja strong{font-weight:600; color:var(--navy)}
.burbuja ul,.burbuja ol{margin:8px 0 8px 20px} .burbuja li{margin-bottom:4px}
.burbuja code{
  font-family:var(--mono); font-size:12px; background:var(--surface-low);
  padding:1px 5px; border-radius:4px; border:1px solid var(--border);
}
.fuentes{margin-top:11px; padding-top:9px; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:5px}
.fuente{
  font-size:10.5px; color:var(--text-mid); background:var(--surface-low);
  border:1px solid var(--border); padding:3px 8px; border-radius:4px;
}
.copiar{
  position:absolute; top:9px; right:11px; background:transparent; border:1px solid var(--border);
  color:var(--text-dim); font-family:var(--sans); font-size:10.5px; padding:3px 9px;
  border-radius:4px; cursor:pointer; opacity:0; transition:all .15s;
}
.msg.ai .burbuja:hover .copiar{opacity:1}
.copiar:hover{background:var(--surface-low); color:var(--text)}
.copiar.ok{opacity:1; color:var(--green); border-color:var(--green)}

.puntos{display:flex; gap:4px; padding:4px 0}
.puntos span{width:6px; height:6px; border-radius:50%; background:var(--ai); animation:salto 1.3s infinite}
.puntos span:nth-child(2){animation-delay:.16s}
.puntos span:nth-child(3){animation-delay:.32s}
@keyframes salto{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.etapa{font-size:11.5px; color:var(--text-dim); margin-top:8px; font-style:italic}

/* ═══ Entrada ═══ */
.entrada{background:var(--surface); border-top:1px solid var(--border); padding:13px 22px; flex-shrink:0}
.entrada-inner{max-width:790px; margin:0 auto}
.campo{
  display:flex; gap:9px; align-items:flex-end; background:var(--surface-low);
  border:1px solid var(--border-mid); border-radius:var(--r-md); padding:9px 11px;
  transition:border-color .15s;
}
.campo:focus-within{border-color:var(--navy); box-shadow:0 0 0 3px rgba(18,52,98,.07)}
textarea{
  flex:1; border:none; background:transparent; resize:none; outline:none;
  font-family:var(--sans); font-size:13.5px; color:var(--text); line-height:1.5;
  max-height:120px; min-height:21px;
}
textarea::placeholder{color:var(--text-dim)}
.btn-enviar{
  width:33px; height:33px; border-radius:var(--r-sm); border:none; background:var(--navy);
  color:#fff; cursor:pointer; display:grid; place-items:center; flex-shrink:0; transition:all .15s;
}
.btn-enviar:hover:not(:disabled){background:var(--navy-hover)}
.btn-enviar:disabled{background:var(--border-mid); cursor:not-allowed}
.pie{font-size:10.5px; color:var(--text-dim); text-align:center; margin-top:7px}

/* ═══ Móvil ═══ */
.btn-menu{display:none; background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:0 4px}
@media(max-width:860px){
  .btn-menu{display:block}
  aside{
    position:fixed; left:0; top:52px; bottom:0; z-index:40; transform:translateX(-100%);
    transition:transform .22s ease; box-shadow:var(--shadow-md);
  }
  aside.abierto{transform:translateX(0)}
  .velo{display:none; position:fixed; inset:52px 0 0; background:rgba(0,0,0,.35); z-index:35}
  .velo.abierto{display:block}
  .hdr-doc{display:none}
  .chat,.entrada,.main-top{padding-left:14px; padding-right:14px}
}
</style>
</head>
<body>

<header>
  <button class="btn-menu" onclick="alternarMenu()" aria-label="Menú">☰</button>
  <img src="/logo" class="hdr-logo" alt="OrthoAnalysis"
       onerror="this.outerHTML='<span style=&quot;font-family:Manrope,serif;font-size:15px;font-weight:700;color:#F58220&quot;>OrthoAnalysis</span>'"/>
  <div class="hdr-sep"></div>
  <span class="hdr-title">Consultor Clínico</span>
  <span class="hdr-badge">Petrovic · Bimler</span>
  <div class="hdr-right">
    <div class="hdr-doc">
      <span class="hdr-doc-name" id="doc-nombre">Identifícate</span>
      <span class="hdr-doc-clinic">OrthoAnalysis v3.0</span>
    </div>
    <div class="hdr-avatar" id="doc-avatar" onclick="pedirNombre()" title="Poner mi nombre">?</div>
  </div>
</header>

<div class="velo" id="velo" onclick="alternarMenu()"></div>

<div class="shell">
  <aside id="aside">
    <div class="side-top">
      <button class="btn-nuevo" onclick="nuevoChat()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Nueva consulta
      </button>
    </div>

    <div class="side-label">Historial</div>
    <div class="historial" id="historial"></div>

    <nav class="side-nav">
      <a class="nav-item" href="/">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><circle cx="11" cy="11" r="3"/>
        </svg>
        Cefalometría
      </a>
      <a class="nav-item active" href="/consultor">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Consultor Clínico
      </a>
      <span class="nav-item pendiente">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3v18h18"/><path d="m7 16 4-4 4 4 4-4"/>
        </svg>
        Analíticas <span class="badge-pronto">Pronto</span>
      </span>
      <span class="nav-item pendiente">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
        </svg>
        Clases <span class="badge-pronto">Pronto</span>
      </span>
    </nav>
  </aside>

  <main>
    <div class="main-top">
      <div class="main-title">
        <h1>Consultor Clínico</h1>
        <span class="chip-ai">IA + bibliografía</span>
        <span class="stats" id="stats">cargando…</span>
      </div>
      <div class="temas" id="temas">
        <button class="tema-btn active" data-tema="">Todos</button>
        <button class="tema-btn" data-tema="tipos_rotacionales">Tipos rotacionales</button>
        <button class="tema-btn" data-tema="petrovic">Petrovic</button>
        <button class="tema-btn" data-tema="bimler">Bimler</button>
        <button class="tema-btn" data-tema="aparatologia">Aparatología</button>
        <button class="tema-btn" data-tema="crecimiento">Crecimiento</button>
        <button class="tema-btn" data-tema="cefalometria">Cefalometría</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="entrada">
      <div class="entrada-inner">
        <div class="campo">
          <textarea id="input" rows="1" placeholder="Escribe tu consulta clínica…"></textarea>
          <button class="btn-enviar" id="btnEnviar" onclick="enviar()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>
            </svg>
          </button>
        </div>
        <div class="pie">Enter para enviar · Shift+Enter nueva línea · Contenido educativo, no sustituye criterio clínico</div>
      </div>
    </div>
  </main>
</div>

<script>
const API = '';
const CLAVE_CHATS = 'ortho_chats';
const CLAVE_NOMBRE = 'ortho_nombre';

let chats = [];          // [{id, titulo, mensajes:[{rol, texto, fuentes}]}]
let chatActivoId = null;
let tema = '';
let ocupado = false;
let timers = [];

/* ── Utilidades ── */
const $ = id => document.getElementById(id);

function escapar(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Markdown mínimo. Se aplica SOLO a la respuesta de la IA (viene del backend),
// nunca al texto del usuario, que va escapado.
function md(t){
  let h = escapar(t);
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/`(.+?)`/g, '<code>$1</code>');
  h = h.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  h = h.replace(/(<li>[\s\S]*?<\/li>)/g, m => '<ul>' + m + '</ul>');
  h = h.split(/\n{2,}/).map(p => p.trim().startsWith('<ul>') ? p : '<p>' + p.replace(/\n/g,'<br>') + '</p>').join('');
  return h;
}

/* ── Persistencia del historial ── */
function cargarChats(){
  try { chats = JSON.parse(localStorage.getItem(CLAVE_CHATS)) || []; }
  catch(e){ chats = []; }
}
function guardarChats(){
  try { localStorage.setItem(CLAVE_CHATS, JSON.stringify(chats.slice(0,50))); }
  catch(e){ console.warn('No se pudo guardar el historial', e); }
}
function chatActivo(){ return chats.find(c => c.id === chatActivoId); }

function nuevoChat(){
  chatActivoId = null;
  pintarHistorial();
  pintarChat();
  cerrarMenuMovil();
  $('input').focus();
}

function borrarChat(id, ev){
  ev.stopPropagation();
  chats = chats.filter(c => c.id !== id);
  if (chatActivoId === id) chatActivoId = null;
  guardarChats();
  pintarHistorial();
  pintarChat();
}

function abrirChat(id){
  chatActivoId = id;
  pintarHistorial();
  pintarChat();
  cerrarMenuMovil();
}

function pintarHistorial(){
  const cont = $('historial');
  if (!chats.length){
    cont.innerHTML = '<div class="historial-vacio">Tus consultas se guardarán aquí, en este navegador.</div>';
    return;
  }
  cont.innerHTML = chats.map(c => `
    <div class="chat-item ${c.id === chatActivoId ? 'active' : ''}" onclick="abrirChat('${c.id}')">
      <svg class="chat-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="chat-titulo">${escapar(c.titulo)}</span>
      <button class="chat-del" onclick="borrarChat('${c.id}',event)" title="Eliminar">&times;</button>
    </div>`).join('');
}

/* ── Pintado del chat ── */
function pintarChat(){
  const c = chatActivo();
  const inner = $('chatInner');
  if (!c || !c.mensajes.length){ inner.innerHTML = plantillaBienvenida(); return; }
  inner.innerHTML = c.mensajes.map(m => burbujaHtml(m)).join('');
  $('chat').scrollTop = $('chat').scrollHeight;
}

function plantillaBienvenida(){
  const sugerencias = [
    '¿Cuáles son los factores de Bimler?',
    '¿Qué significa el indicador T1 en Petrovic?',
    '¿Cómo se determina la categoría auxológica?',
    '¿Qué aparato se indica en un grupo rotacional R1?'
  ];
  return `<div class="bienvenida">
    <div class="bienv-ico">🧠</div>
    <h2>¿En qué puedo ayudarte?</h2>
    <p>Consulta sobre cefalometría de Bimler, indicadores de Petrovic-Lavergne,
       tipos rotacionales o aparatología. Respondo apoyándome en la bibliografía cargada.</p>
    <div class="sugerencias">
      ${sugerencias.map(s => `<button class="sug" onclick="usarSugerencia(this)">${escapar(s)}</button>`).join('')}
    </div>
  </div>`;
}

function usarSugerencia(btn){
  $('input').value = btn.textContent.trim();
  enviar();
}

function burbujaHtml(m){
  if (m.rol === 'user'){
    return `<div class="msg user">
      <div class="msg-av">${iniciales(localStorage.getItem(CLAVE_NOMBRE) || 'DR')}</div>
      <div class="burbuja">${escapar(m.texto)}</div>
    </div>`;
  }
  const fuentes = (m.fuentes && m.fuentes.length)
    ? `<div class="fuentes">${m.fuentes.map(f => `<span class="fuente">📄 ${escapar(f)}</span>`).join('')}</div>`
    : '';
  return `<div class="msg ai">
    <div class="msg-av">🧠</div>
    <div class="burbuja">${md(m.texto)}${fuentes}
      <button class="copiar" onclick="copiar(this)">Copiar</button>
    </div>
  </div>`;
}

function copiar(btn){
  const b = btn.closest('.burbuja').cloneNode(true);
  const x = b.querySelector('.copiar'); if (x) x.remove();
  navigator.clipboard.writeText(b.innerText.trim()).then(() => {
    btn.textContent = 'Copiado'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('ok'); }, 1600);
  });
}

/* ── Indicador de espera ── */
function mostrarEspera(){
  $('chatInner').insertAdjacentHTML('beforeend', `
    <div class="msg ai" id="espera">
      <div class="msg-av">🧠</div>
      <div class="burbuja">
        <div class="puntos"><span></span><span></span><span></span></div>
        <div class="etapa" id="etapa"></div>
      </div>
    </div>`);
  $('chat').scrollTop = $('chat').scrollHeight;

  // La consulta tarda ~15 s: sin señales de avance parece que se colgó.
  const pasos = [[1500,'Buscando en la bibliografía…'],
                 [5000,'Revisando fragmentos relevantes…'],
                 [9000,'Redactando la respuesta…']];
  timers = pasos.map(([ms,txt]) => setTimeout(() => { const e = $('etapa'); if (e) e.textContent = txt; }, ms));
}

function quitarEspera(){
  timers.forEach(clearTimeout); timers = [];
  const e = $('espera'); if (e) e.remove();
}

/* ── Envío ── */
function agregarMensaje(rol, texto, fuentes){
  let c = chatActivo();
  if (!c){
    c = { id: 'c' + Date.now(), titulo: texto.slice(0,42), mensajes: [] };
    chats.unshift(c);
    chatActivoId = c.id;
    pintarHistorial();
  }
  c.mensajes.push({ rol, texto, fuentes: fuentes || [] });
  guardarChats();
  const inner = $('chatInner');
  if (c.mensajes.length === 1) inner.innerHTML = '';
  inner.insertAdjacentHTML('beforeend', burbujaHtml({ rol, texto, fuentes }));
  $('chat').scrollTop = $('chat').scrollHeight;
}

async function enviar(){
  if (ocupado) return;
  const input = $('input');
  const pregunta = input.value.trim();
  if (!pregunta) return;

  input.value = ''; input.style.height = 'auto';
  ocupado = true; $('btnEnviar').disabled = true;

  agregarMensaje('user', pregunta);
  mostrarEspera();

  try {
    const r = await fetch(`${API}/api/consultor`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ pregunta, tema: tema || 'general' })
    });
    const ct = r.headers.get('content-type') || '';
    if (!ct.includes('application/json')){
      const cuerpo = await r.text();
      throw new Error('El servidor respondió ' + r.status + ': ' + cuerpo.slice(0,110));
    }
    const d = await r.json();
    quitarEspera();
    if (!d.success)              agregarMensaje('ai', '⚠️ ' + (d.detail || 'No se pudo conectar al servidor.'));
    else if (!d.fue_respondida)  agregarMensaje('ai', d.respuesta);
    else                         agregarMensaje('ai', d.respuesta, d.fuentes);
  } catch(err){
    quitarEspera();
    agregarMensaje('ai', '⚠️ Error de conexión. ' + err.message);
  } finally {
    ocupado = false; $('btnEnviar').disabled = false; input.focus();
  }
}

/* ── Identificación ligera (sin login) ── */
function iniciales(n){
  const p = n.trim().split(/\s+/);
  return ((p[0][0] || 'D') + (p[1] ? p[1][0] : '')).toUpperCase();
}
function aplicarNombre(n){
  if (!n) return;
  $('doc-nombre').textContent = n.trim();
  $('doc-avatar').textContent = iniciales(n);
}
function pedirNombre(){
  const actual = localStorage.getItem(CLAVE_NOMBRE) || '';
  const n = prompt('¿Cómo te llamas? (solo se guarda en este navegador)', actual);
  if (n && n.trim()){
    localStorage.setItem(CLAVE_NOMBRE, n.trim());
    aplicarNombre(n.trim());
    pintarChat();
  }
}

/* ── Móvil ── */
function alternarMenu(){
  $('aside').classList.toggle('abierto');
  $('velo').classList.toggle('abierto');
}
function cerrarMenuMovil(){
  $('aside').classList.remove('abierto');
  $('velo').classList.remove('abierto');
}

/* ── Arranque ── */
document.querySelectorAll('.tema-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tema-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    tema = b.dataset.tema;
  });
});

const input = $('input');
input.addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviar(); }
});

(function init(){
  const url = new URLSearchParams(location.search).get('dr');
  if (url) localStorage.setItem(CLAVE_NOMBRE, url);
  aplicarNombre(localStorage.getItem(CLAVE_NOMBRE));
  cargarChats();
  pintarHistorial();
  pintarChat();
})();

(async function stats(){
  try {
    const r = await fetch(`${API}/api/consultor/stats`);
    const d = await r.json();
    $('stats').textContent = d.fragmentos
      ? d.fragmentos.toLocaleString('es') + ' fragmentos'
      : 'bibliografía cargada';
  } catch(e){ $('stats').textContent = ''; }
})();
</script>
